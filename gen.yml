version: "1"
database:
  # 可改为 db: "${GENKIT_DB}" 和 dsn: "${GENKIT_DSN}"，从 .env 或系统环境读取。
  db: mysql
  dsn: "root:password@tcp(127.0.0.1:3306)/example?charset=utf8mb4&parseTime=True&loc=Local"
  tables: [] # 留空生成所有表
  onlyModel: false
  outPath: ./dao/query
  modelPkgName: model
  withDefaultQuery: true
  withQueryInterface: true
  fieldNullable: false
  fieldWithTypeTag: true

  # 仅支持配置文件；gorm.DeletedAt 仅应用于时间列，非时间列使用普通映射。
  # 未显式配置 softDelete 时，默认使用以下配置。
  softDelete:
    column: deleted_at
    type: gorm.DeletedAt

  # 仅支持配置文件；键必须与驱动返回的 DatabaseTypeName() 完全一致。
  dataTypeMap:
    bigint: int64
    decimal: decimal.Decimal
    json: datatypes.JSON
  importPkgPaths:
    - github.com/shopspring/decimal
    - gorm.io/datatypes
